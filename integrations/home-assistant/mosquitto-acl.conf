# Mosquitto ACL for the secure edition: one user per TV, and one for the computer that runs the audit.
# Add with `acl_file /mosquitto/config/acl.conf` in mosquitto.conf and create the users with mosquitto_passwd.
# The topics use the device slug: "Living Room TV" -> living_room_tv.

# The TV's watchdog: its own topics, its own discovery configs, nothing else.
user tv-living-room
topic readwrite cleanyourtv/living_room_tv/#
topic write homeassistant/+/cleanyourtv_living_room_tv/#

# The computer that runs tools/security_audit.py and tools/adb_autoclose.py. One block of lines per TV:
# a wildcard over homeassistant/ would let it rewrite any device's discovery config (a lock's, say).
user cleanyourtv-tools
topic write cleanyourtv/living_room_tv/audit
topic write cleanyourtv/living_room_tv/event
topic write cleanyourtv/living_room_tv/adb_close
topic write homeassistant/+/cleanyourtv_living_room_tv/#
